services:
  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_PROXY_TARGET: http://server:5000

volumes:
  certbot-webroot: