# Production config for dissertation.mercythira.com — mounted only by
# docker-compose.prod.yml (via the -f override), never by the base
# docker-compose.yml, so local `docker compose up` never touches this file
# or the /etc/letsencrypt certificates it requires.
#
# Backend port: this Droplet's .env sets PORT=5000 for the `server`
# container (the repo's own default, used everywhere else, is 3000 — see
# server/.env.example). Keep this proxy_pass in sync with whatever PORT is
# actually set in /opt/app/.env on the Droplet.

server {
    listen 80;
    server_name dissertation.mercythira.com;

    # Let certbot renew certificates over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dissertation.mercythira.com;

    ssl_certificate     /etc/letsencrypt/live/dissertation.mercythira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dissertation.mercythira.com/privkey.pem;

    # ChainBreak backend API
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO / WebSocket
    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React/Vite frontend
    location / {
        proxy_pass http://client:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
